name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Windows binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build GUI binary (no console)
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" -o dist/agent-smith.exe ./cmd/agent-smith

      - name: Build console binary (for --cli / --bufferbloat)
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/agent-smith-cli.exe ./cmd/agent-smith

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Agent Smith ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/agent-smith.exe
            dist/agent-smith-cli.exe
          fail_on_unmatched_files: true
