name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign & publish Windows binaries
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build GUI binary (no console)
        run: go build -tags desktop,production -trimpath -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" -o dist/agent-smith.exe ./cmd/agent-smith

      - name: Build console binary (for --cli / --bufferbloat / --trace / --check / --report)
        run: go build -tags desktop,production -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/agent-smith-cli.exe ./cmd/agent-smith

      # Authenticode signing with Azure Trusted Signing (account agrussigning,
      # profile agrus-public). Credentials are repository secrets; the
      # account, profile and endpoint are not secret.
      - name: Sign binaries (Azure Trusted Signing)
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: agrussigning
          certificate-profile-name: agrus-public
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem dist\*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} ({2})" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad binaries are not validly signed" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Agent Smith ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/agent-smith.exe
            dist/agent-smith-cli.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
