name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Build (all packages)
        run: go build ./...

  build-windows-gui:
    name: Build Windows GUI binary
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Build GUI exe
        run: go build -ldflags "-H windowsgui -X main.version=ci-${{ github.sha }}" -o agent-smith.exe ./cmd/agent-smith
      - uses: actions/upload-artifact@v4
        with:
          name: agent-smith-windows-amd64
          path: agent-smith.exe
          if-no-files-found: error
